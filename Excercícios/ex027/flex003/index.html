<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        div.container {
            background-color: lightsalmon;
            display: flex;/*
            flex-direction: row;
            flex-wrap: nowrap;*/
            flex-flow: row nowrap;/*forma mais rápido de usar flex*/
        }
        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto; /* não permite espaço em branco*/
            
        }
    </style>
</head>
<body>
    <div class="container">
          <div class="item">Exemplod de bloco A</div>
          <div class="item">Exemplod de bloco B</div>
          <div class="item">Exemplod de bloco C</div>
          <div class="item">Exemplod de bloco D</div>
          <div class="item">Exemplod de bloco E</div>
          <div class="item">Exemplod de bloco F</div>
          <div class="item">Exemplod de bloco G</div>
    </div>
</body>
</html>
